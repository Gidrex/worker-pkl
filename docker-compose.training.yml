services:
  training:
    build:
      context: .
      target: base
    image: worker-pkl:training
    container_name: worker-pkl-training
    command: uv run scripts/train_model.py
    volumes:
      - ./datasets:/app/datasets:ro
      - ./weights:/app/weights
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 6G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '4gb'
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
      - OMP_NUM_THREADS=4
      - CUDA_VISIBLE_DEVICES=0
    restart: "no"
